[workspace]
members = [
  "cli/greenways",
  "cli/greenways-admin",
  "crates/greenways-authority",
  "crates/greenways-applications",
  "crates/greenways-capabilities",
  "crates/greenways-hestia",
  "crates/greenways-identity",
  "crates/greenways-local",
  "crates/greenways-protocol",
  "crates/greenways-provider",
  "crates/greenways-vault",
  "services/greenways-desktop-bridge",
  "services/greenwaysd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "EPL-2.0"
repository = "https://github.com/greenways-ai/greenways-os"

[workspace.dependencies]
getrandom = "0.2.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"

[workspace.lints.rust]
unsafe_code = "forbid"
