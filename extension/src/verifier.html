  <title>Verify Greenways evidence</title>

<body data-view="studio">
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">g</span><span><strong>Greenways Verifier</strong><small>Independent local verification</small></span></div></header>

      <section class="card"><input data-file type="file" accept="application/json,.json"><div data-result class="empty">No bundle selected.</div></section>
    </main><footer class="footer">VERIFY SIGNATURES · VERIFY PERSONAL CHAIN · VERIFY CONTENT ROOTS</footer>
  </div>
