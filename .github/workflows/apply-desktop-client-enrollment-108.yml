name: Apply Desktop client enrollment

on:
  push:
    branches:
      - agent/desktop-client-enrollment-108-apply
    paths:
      - .github/agent/desktop-client-enrollment-108-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-client-enrollment-108-apply
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Reconstruct the reviewed enrollment patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = b''.join(
              b''.join(
                  Path(f'.github/agent/desktop-client-enrollment-108.part-{index:02d}')
                  .read_bytes()
                  .split()
              )
              for index in range(2)
          )
          assert len(encoded) == 11840
          assert hashlib.sha256(encoded).hexdigest() == '1210f5894b9e5d8108c5212f82b47f1df1fec58241805162faf6f055c638d3eb'
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == 8879
          assert hashlib.sha256(archive).hexdigest() == 'ac9131af60e3e8b5c61563b6e6ab097727d7c9ff4bff05a6a575db05aff8f109'
          patch = gzip.decompress(archive)
          assert len(patch) == 40331
          assert hashlib.sha256(patch).hexdigest() == '73e285b503dbe3d12f243714c00b12f7abd475ac166ee0771934d8e4589e7083'
          Path('/tmp/desktop-client-enrollment-108.patch').write_bytes(patch)
          PY
      - name: Apply, format, and validate the source slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/desktop-service-92-clean
          git switch --detach origin/agent/desktop-service-92-clean
          git switch -C agent/desktop-client-enrollment-108

          set +e
          patch -p1 --batch --forward < /tmp/desktop-client-enrollment-108.patch
          patch_status=$?
          set -e
          test "$patch_status" -eq 1

          find services/greenways-desktop-bridge/src/setup -name '*.rej' -print | sort > /tmp/actual-rejects
          cat > /tmp/expected-rejects <<'REJECTS'
          services/greenways-desktop-bridge/src/setup/inspect.rs.rej
          services/greenways-desktop-bridge/src/setup/service.rs.rej
          services/greenways-desktop-bridge/src/setup/tests.rs.rej
          REJECTS
          sed -i '' 's/^          //' /tmp/expected-rejects
          diff -u /tmp/expected-rejects /tmp/actual-rejects

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              source = Path(path)
              text = source.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one reviewed merge anchor')
              source.write_text(text.replace(old, new, 1))

          replace_once(
              'services/greenways-desktop-bridge/src/setup/inspect.rs',
              '''            OwnedPathState::Ready => match read_credential_file(&credential_path) {
                Ok(credential) if credential.role == LocalClientRole::Desktop => Ok(
                    DesktopSetupComponent::ready(DesktopSetupComponentKind::DesktopClient),
                ),
                Ok(_) => Ok(DesktopSetupComponent::blocked(
                    DesktopSetupComponentKind::DesktopClient,
                    DesktopSetupState::CredentialRoleMismatch,
                    "desktop-credential-role-mismatch",
                )),
                Err(_) => Ok(DesktopSetupComponent::blocked(
                    DesktopSetupComponentKind::DesktopClient,
                    DesktopSetupState::ManualRecoveryRequired,
                    "desktop-credential-invalid",
                )),
            },''',
              '''            OwnedPathState::Ready => {
                let credential = match read_credential_file(&credential_path) {
                    Ok(credential) => credential,
                    Err(_) => {
                        return Ok(DesktopSetupComponent::blocked(
                            DesktopSetupComponentKind::DesktopClient,
                            DesktopSetupState::ManualRecoveryRequired,
                            "desktop-credential-invalid",
                        ));
                    }
                };
                if credential.role != LocalClientRole::Desktop {
                    return Ok(DesktopSetupComponent::blocked(
                        DesktopSetupComponentKind::DesktopClient,
                        DesktopSetupState::CredentialRoleMismatch,
                        "desktop-credential-role-mismatch",
                    ));
                }
                if registry_state != OwnedPathState::Ready {
                    return Ok(DesktopSetupComponent::blocked(
                        DesktopSetupComponentKind::DesktopClient,
                        DesktopSetupState::ManualRecoveryRequired,
                        "desktop-registry-required",
                    ));
                }
                let registry = match LocalClientRegistry::open(&registry_path) {
                    Ok(registry) => registry,
                    Err(_) => {
                        return Ok(DesktopSetupComponent::blocked(
                            DesktopSetupComponentKind::DesktopClient,
                            DesktopSetupState::ManualRecoveryRequired,
                            "desktop-registry-invalid",
                        ));
                    }
                };
                match registry.verify_credential(&credential) {
                    Ok(client) => Ok(DesktopSetupComponent::ready(
                        DesktopSetupComponentKind::DesktopClient,
                    )
                    .with_public_id(client.id)),
                    Err(_) => Ok(DesktopSetupComponent::blocked(
                        DesktopSetupComponentKind::DesktopClient,
                        DesktopSetupState::ManualRecoveryRequired,
                        "desktop-credential-rejected",
                    )),
                }
            }''',
          )

          replace_once(
              'services/greenways-desktop-bridge/src/setup/service.rs',
              '''pub trait LaunchAgentController {
    fn restart(
        &mut self,
        launch_agent: &Path,
        label: &str,
        uid: u32,
    ) -> Result<(), DesktopSetupError>;
}''',
              '''pub trait LaunchAgentController {
    fn stop(&mut self, label: &str, uid: u32) -> Result<(), DesktopSetupError>;

    fn restart(
        &mut self,
        launch_agent: &Path,
        label: &str,
        uid: u32,
    ) -> Result<(), DesktopSetupError>;
}''',
          )

          replace_once(
              'services/greenways-desktop-bridge/src/setup/tests.rs',
              '''    service::{
        expected_launch_agent_plist, LaunchAgentController, SetupPaths, DAEMON_SERVICE_LABEL,
    },
    DesktopSetupBackend, DesktopSetupComponentKind, DesktopSetupError, DesktopSetupHost,
    DesktopSetupOperation, DesktopSetupRequest, DesktopSetupState, DESKTOP_SETUP_PROTOCOL,
    DESKTOP_SETUP_RESULT_PROTOCOL,
};
use std::{''',
              '''    service::{
        expected_launch_agent_plist, LaunchAgentController, SetupPaths, DAEMON_SERVICE_LABEL,
        DESKTOP_CLIENT_LABEL,
    },
    DesktopSetupBackend, DesktopSetupComponentKind, DesktopSetupError, DesktopSetupHost,
    DesktopSetupOperation, DesktopSetupRequest, DesktopSetupState, DESKTOP_SETUP_PROTOCOL,
    DESKTOP_SETUP_RESULT_PROTOCOL,
};
use greenways_authority::{read_credential_file, LocalClientRegistry, LocalClientRole};
use std::{''',
          )
          PY

          find . -name '*.orig' -delete
          find . -name '*.rej' -delete
          test -z "$(find . -name '*.orig' -o -name '*.rej')"

          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test -p greenways-desktop-bridge --all-targets
          cargo +1.85.1 clippy -p greenways-desktop-bridge --all-targets -- -D warnings

          cd apps/greenways_desktop
          flutter config --enable-macos-desktop
          tool/build_macos.sh
          cd ../..

          git diff --check
          cat > /tmp/expected-files <<'FILES'
          apps/greenways_desktop/README.md
          apps/greenways_desktop/lib/controller/setup_controller.dart
          apps/greenways_desktop/lib/model/setup_snapshot_validation.dart
          apps/greenways_desktop/lib/ui/setup_view.dart
          apps/greenways_desktop/test/desktop_shell_test.dart
          apps/greenways_desktop/test/setup_controller_test.dart
          apps/greenways_desktop/test/setup_snapshot_test.dart
          apps/greenways_desktop/test/support/fakes.dart
          protocol/desktop-setup.md
          services/greenways-desktop-bridge/src/setup/host.rs
          services/greenways-desktop-bridge/src/setup/inspect.rs
          services/greenways-desktop-bridge/src/setup/mod.rs
          services/greenways-desktop-bridge/src/setup/service.rs
          services/greenways-desktop-bridge/src/setup/tests.rs
          FILES
          sed -i '' 's/^          //' /tmp/expected-files
          xargs git add -N -- < /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git status --porcelain | grep '^??' || true)"
      - name: Publish the clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          xargs git add -- < /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          git commit -m 'Enroll the initial Desktop local client'
          git push --force origin HEAD:refs/heads/agent/desktop-client-enrollment-108
          git rev-parse HEAD
