name: Apply Desktop client enrollment

on:
  push:
    branches:
      - agent/desktop-client-enrollment-108-apply
    paths:
      - .github/agent/desktop-client-enrollment-108-apply

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-client-enrollment-108-apply
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Reconstruct the reviewed enrollment patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent/apply-enrollment-108.py reconstruct
          cp .github/agent/apply-enrollment-108.py /tmp/apply-enrollment-108.py
      - name: Apply and resolve the reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git switch -C agent/desktop-client-enrollment-108

          set +e
          patch -p1 --batch --forward < /tmp/desktop-client-enrollment-108.patch
          patch_status=$?
          set -e
          test "$patch_status" -eq 1

          find services/greenways-desktop-bridge/src/setup -name '*.rej' -print | sort > /tmp/actual-rejects
          cat > /tmp/expected-rejects <<'REJECTS'
          services/greenways-desktop-bridge/src/setup/inspect.rs.rej
          services/greenways-desktop-bridge/src/setup/service.rs.rej
          services/greenways-desktop-bridge/src/setup/tests.rs.rej
          REJECTS
          sed -i '' 's/^          //' /tmp/expected-rejects
          diff -u /tmp/expected-rejects /tmp/actual-rejects

          python3 /tmp/apply-enrollment-108.py resolve
          test -z "$(find . \( -name '*.orig' -o -name '*.rej' \) -print)"
      - name: Format and validate the source slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test -p greenways-desktop-bridge --all-targets
          cargo +1.85.1 clippy -p greenways-desktop-bridge --all-targets -- -D warnings

          cd apps/greenways_desktop
          flutter config --enable-macos-desktop
          tool/build_macos.sh
          cd ../..

          git diff --check
          cat > /tmp/expected-files <<'FILES'
          apps/greenways_desktop/README.md
          apps/greenways_desktop/lib/controller/setup_controller.dart
          apps/greenways_desktop/lib/model/setup_snapshot_validation.dart
          apps/greenways_desktop/lib/ui/setup_view.dart
          apps/greenways_desktop/test/desktop_shell_test.dart
          apps/greenways_desktop/test/setup_controller_test.dart
          apps/greenways_desktop/test/setup_snapshot_test.dart
          apps/greenways_desktop/test/support/fakes.dart
          crates/greenways-workspace-contracts/src/resource.rs
          crates/greenways-workspace-contracts/tests/limits.rs
          protocol/desktop-setup.md
          services/greenways-desktop-bridge/src/setup/host.rs
          services/greenways-desktop-bridge/src/setup/inspect.rs
          services/greenways-desktop-bridge/src/setup/mod.rs
          services/greenways-desktop-bridge/src/setup/service.rs
          services/greenways-desktop-bridge/src/setup/tests.rs
          FILES
          sed -i '' 's/^          //' /tmp/expected-files
          xargs git add -N -- < /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git status --porcelain | grep '^??' || true)"
      - name: Publish the clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          xargs git add -- < /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          git commit -m 'Enroll the initial Desktop local client'
          git push --force origin HEAD:refs/heads/agent/desktop-client-enrollment-108
          git rev-parse HEAD
