name: Typed provider invocation bootstrap

on:
  push:
    branches:
      - agent/greenwaysd-provider-invoke-51

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run typed provider invocation bootstrap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, reconcile, and apply provider invocation slice
        run: |
          cat .github/agent/provider-invoke/apply.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/provider-invoke-apply.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('/tmp/provider-invoke-apply.py')
          source = path.read_text()
          old = 'Session opening requires one credential object.'
          new = 'Local session opening requires one credential object.'
          if old not in source:
              raise SystemExit('stale session-error marker was not found')
          source = source.replace(old, new, 1)
          source = source.replace(r"b\'\r\'", r"b\'\\r\'")
          source = source.replace(r"b\'\n\'", r"b\'\\n\'")

          module = ast.parse(source)
          operation_assignment = None
          for node in module.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == 'OPERATIONS'
                  for target in node.targets
              ):
                  operation_assignment = node
                  break
          if operation_assignment is None:
              raise SystemExit('bootstrap operations were not found')
          operations = ast.literal_eval(operation_assignment.value)

          operations[23] = (
              'crates/greenways-local/src/lib.rs',
              '''    pub fn clients(&mut self) -> Result<LocalResponse, LocalError> {
                  self.send(&LocalRequest::clients_list(new_request_id()?))
              }

              pub fn send(''',
              '''    pub fn clients(&mut self) -> Result<LocalResponse, LocalError> {
                  self.send(&LocalRequest::clients_list(new_request_id()?))
              }

              pub fn invoke(
                  &mut self,
                  invocation: ProviderInvocation,
              ) -> Result<LocalResponse, LocalError> {
                  self.send(&LocalRequest::provider_invoke(
                      new_request_id()?,
                      invocation,
                  )?)
              }

              pub fn send(''',
          )
          operations[25] = (
              'services/greenwaysd/src/lib.rs',
              '''use greenways_authority::{
                  new_local_session,''',
              '''mod provider;

              use greenways_authority::{
                  new_local_session,''',
          )
          operations[29] = (
              'services/greenwaysd/src/lib.rs',
              '''        if request.operation == "authority.clients.list"
                  && actor
                      .as_ref()
                      .is_some_and(|actor| !role_may_list_clients(actor.role))
              {
                  return Ok(LocalResponse::error(
                      request.request_id,
                      "authority-denied",
                      "This local client role cannot inspect Greenways authority state.",
                  ));
              }
              let digest = request_digest(&request)?;''',
              '''        if request.operation == "authority.clients.list"
                  && actor
                      .as_ref()
                      .is_some_and(|actor| !role_may_list_clients(actor.role))
              {
                  return Ok(LocalResponse::error(
                      request.request_id,
                      "authority-denied",
                      "This local client role cannot inspect Greenways authority state.",
                  ));
              }
              if request.operation == "provider.invoke" {
                  let actor = actor.ok_or_else(|| {
                      DaemonError::State("authenticated provider request has no actor".to_owned())
                  })?;
                  if !role_may_invoke_provider(actor.role) {
                      return Ok(LocalResponse::error(
                          request.request_id,
                          "authority-denied",
                          "This local client role cannot invoke daemon provider credentials.",
                      ));
                  }
                  return self.handle_provider_invocation_at(request, actor, observed_at_unix_ms);
              }

              let digest = request_digest(&request)?;''',
          )

          operation_assignment.value = ast.parse(repr(operations), mode='eval').body
          ast.fix_missing_locations(module)

          missing = []
          for index, (filename, expected, _) in enumerate(operations):
              count = Path(filename).read_text().count(expected)
              if count != 1:
                  missing.append((index, filename, count, expected[:140]))
          if missing:
              for index, filename, count, expected in missing:
                  print(f'MISSING[{index}] {filename}: count={count}: {expected!r}')
              raise SystemExit(f'{len(missing)} exact replacement markers require reconciliation')

          namespace = {
              '__name__': '__main__',
              '__file__': str(path),
          }
          exec(compile(module, str(path), 'exec'), namespace)
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Format workspace
        run: cargo +1.85.1 fmt --all

      - name: Test workspace
        run: cargo +1.85.1 test --workspace --all-targets

      - name: Lint workspace
        run: cargo +1.85.1 clippy --workspace --all-targets -- -D warnings

      - name: Verify repository patch
        run: git diff --check

      - name: Remove bootstrap material
        run: |
          rm -rf .github/agent/provider-invoke
          rm -f .github/workflows/provider-invoke-bootstrap.yml

      - name: Commit and push validated implementation
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Add typed daemon provider invocation"
          git push origin HEAD:${GITHUB_REF_NAME}
