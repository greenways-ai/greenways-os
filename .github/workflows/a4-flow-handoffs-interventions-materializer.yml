name: A4 Flow handoffs and interventions materializer

on:
  push:
    branches:
      - agent/flow-handoffs-interventions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flow-handoffs-interventions
          fetch-depth: 0
      - name: Merge the exact current main revision
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Register the contract and bounded agent request capabilities
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          lib = Path('crates/greenways-workspace-contracts/src/lib.rs')
          replace_once(
              lib,
              'mod flow;\nmod flow_participation;',
              'mod flow;\nmod flow_handoff_intervention;\nmod flow_participation;',
              'Flow handoff module registration',
          )
          replace_once(
              lib,
              'pub use flow::*;\npub use flow_participation::*;',
              'pub use flow::*;\npub use flow_handoff_intervention::*;\npub use flow_participation::*;',
              'Flow handoff exports',
          )

          participation = Path(
              'crates/greenways-workspace-contracts/src/flow_participation.rs'
          )
          replace_once(
              participation,
              '    WorkTransition,\n    WorkClaim,\n    BuildoutRead,',
              '    WorkTransition,\n    WorkClaim,\n    HandoffRequest,\n    InterventionRaise,\n    BuildoutRead,',
              'Agent handoff capabilities',
          )

          fixture_path = Path(
              'crates/greenways-workspace-contracts/tests/fixtures/flow/'
              'project-participation.json'
          )
          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          capabilities = fixture['agentMandates'][0]['capabilities']
          marker = capabilities.index('work-claim') + 1
          for capability in reversed(['handoff-request', 'intervention-raise']):
              if capability not in capabilities:
                  capabilities.insert(marker, capability)
          fixture_path.write_text(
              json.dumps(fixture, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          documentation = Path('docs/flow-project-participation.md')
          replace_once(
              documentation,
              'This contract extends the merged Flow project aggregate with project membership and bounded agent mandates. It does not introduce host/session presence, work claims, handoffs, interventions, or a Control Room view model.',
              'This contract defines the project membership and bounded agent-mandate boundary. Later merged contracts add host/session presence, work claims, and the two request-only handoff/intervention capabilities without widening identity, provider, host, credential, or application authority.',
              'Participation scope status',
          )
          replace_once(
              documentation,
              'work-transition\nwork-claim\nbuildout-read',
              'work-transition\nwork-claim\nhandoff-request\nintervention-raise\nbuildout-read',
              'Participation capability inventory',
          )
          replace_once(
              documentation,
              '''## Deferred slices

Subsequent A4 pull requests own:

1. work dependency and claim/lease records;
2. host/session presence and restart reconciliation;
3. handoff and intervention records;
4. activity/evidence and external read-back projections; and
5. closed Desktop, CLI, browser, and MCP Project Control Room view models.

This contract introduces no generic database, filesystem, provider, browser, process, shell, native, credential, or application-authority handle.''',
              '''## Downstream extensions

Merged A4 contracts now consume this boundary for work dependencies and claims, host/session presence, and project handoff/intervention requests. `handoff-request` and `intervention-raise` allow an active agent to propose bounded coordination records only; they do not allow the agent to approve interventions, manage membership or mandates, attach hosts, invoke providers, select credentials, repeat effects, or transfer authority.

Activity/evidence, external read-back, and closed Desktop, CLI, browser, and MCP Project Control Room view models remain later independent slices.

This contract introduces no generic database, filesystem, provider, browser, process, shell, native, credential, or application-authority handle.''',
              'Participation downstream status',
          )
          PY
      - name: Remove the temporary publisher before closing evidence
        run: git rm .github/workflows/a4-flow-handoffs-interventions-materializer.yml
      - name: Regenerate the closed Flow compatibility inventory
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import runpy
          from pathlib import Path

          inventory_path = Path(
              'protocol/compatibility/flow-build-foreman-inventory-0-alpha.json'
          )
          checker = runpy.run_path('scripts/check-flow-build-foreman-inventory.py')
          findings, forbidden, _counts = checker['scan_findings']()
          if forbidden:
              raise SystemExit('forbidden Build identity found:\n' + '\n'.join(forbidden))
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          inventory['findings'] = findings
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Format and validate the exact contract
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          python3 scripts/check-flow-build-foreman-inventory.py
          cargo +1.85.1 test -p greenways-workspace-contracts --all-targets
          cargo +1.85.1 clippy -p greenways-workspace-contracts --all-targets -- -D warnings
          python3 -m json.tool protocol/compatibility/flow-build-foreman-inventory-0-alpha.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoffs-interventions.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoff-intervention-restart.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/handoff-intervention-operation-catalogue.json >/dev/null
          git diff --check
      - name: Enforce the exact A4.4 review surface
        run: |
          set -euo pipefail
          git diff --name-only origin/main | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          crates/greenways-workspace-contracts/src/flow_handoff_intervention.rs
          crates/greenways-workspace-contracts/src/flow_participation.rs
          crates/greenways-workspace-contracts/src/lib.rs
          crates/greenways-workspace-contracts/tests/fixtures/flow/handoff-intervention-operation-catalogue.json
          crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoff-intervention-restart.json
          crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoffs-interventions.json
          crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json
          crates/greenways-workspace-contracts/tests/flow_handoff_intervention.rs
          docs/flow-handoffs-interventions.md
          docs/flow-project-participation.md
          protocol/compatibility/flow-build-foreman-inventory-0-alpha.json
          EOF
          diff -u /tmp/expected-paths /tmp/actual-paths
          test ! -e .github/workflows/a4-flow-handoffs-interventions-materializer.yml
      - name: Publish one self-cleaning branch commit
        run: |
          set -euo pipefail
          git add -- \
            crates/greenways-workspace-contracts/src/flow_handoff_intervention.rs \
            crates/greenways-workspace-contracts/src/flow_participation.rs \
            crates/greenways-workspace-contracts/src/lib.rs \
            crates/greenways-workspace-contracts/tests/fixtures/flow/handoff-intervention-operation-catalogue.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoff-intervention-restart.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-handoffs-interventions.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json \
            crates/greenways-workspace-contracts/tests/flow_handoff_intervention.rs \
            docs/flow-handoffs-interventions.md \
            docs/flow-project-participation.md \
            protocol/compatibility/flow-build-foreman-inventory-0-alpha.json
          git diff --cached --check
          git commit -m "Define Flow project handoffs and interventions"
          git push origin HEAD:agent/flow-handoffs-interventions
