name: Repair Capability Authority Core

on:
  push:
    branches:
      - agent/greenwaysd-capability-core-repair-51
    paths:
      - .github/agent/capability-core-repair/**
      - .github/workflows/capability-core-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-capability-core-repair-51
          fetch-depth: 0

      - name: Prepare current workspace and typed identity anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one repair anchor, found {count}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "Cargo.toml",
              '  "crates/greenways-authority",\n  "crates/greenways-identity",\n',
              '  "crates/greenways-authority",\n  "crates/greenways-capabilities",\n  "crates/greenways-identity",\n',
          )
          replace_once(
              "crates/greenways-identity/Cargo.toml",
              '[dependencies]\n',
              '[features]\ntest-support = []\n\n[dependencies]\n',
          )
          replace_once(
              "crates/greenways-identity/src/lib.rs",
              'pub fn verify_signed_profile_identity(signed: &SignedProfileIdentity) -> Result<(), IdentityError> {\n',
              'pub fn verify_signed_profile_identity(\n    signed: &SignedProfileIdentity,\n) -> Result<(), IdentityError> {\n',
          )
          PY

      - name: Apply reviewed signed capability integration
        run: |
          set -euo pipefail
          python3 .github/agent/capability-core-repair/apply.py
          python3 .github/agent/capability-core-repair/harden.py

      - name: Update the signer-vocabulary invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/greenways-identity/src/lib.rs')
          text = path.read_text()
          old = '''        assert_eq!(
              vault.status().typed_subjects,
              vec![PROFILE_IDENTITY_SUBJECT_PROTOCOL.to_owned()]
          );
          '''
          new = '''        assert_eq!(
              vault.status().typed_subjects,
              vec![
                  PROFILE_IDENTITY_SUBJECT_PROTOCOL.to_owned(),
                  CAPABILITY_GRANT_SUBJECT_PROTOCOL.to_owned(),
                  CAPABILITY_REVOCATION_SUBJECT_PROTOCOL.to_owned(),
              ]
          );
          '''
          if text.count(old) != 1:
              raise SystemExit('identity typed-subject test anchor was not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Validate exact final source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Remove incomplete bootstrap artifacts
        run: |
          rm -rf .github/agent/capability-ipc
          rm -f .github/workflows/capability-ipc-bootstrap.yml
          rm -rf .github/agent/capability-admin
          rm -f .github/workflows/capability-admin-bootstrap.yml
          rm -rf .github/agent/capability-core-repair
          rm -f .github/workflows/capability-core-repair.yml

      - name: Commit validated capability authority core
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'greenways-os-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add signed daemon capability authority core' -m 'Repairs the incomplete #65/#67/#69 bootstrap train. Refs #51.'
          git push origin HEAD:agent/greenwaysd-capability-core-repair-51
