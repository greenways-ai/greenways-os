name: Materialize hara offscreen runtime

on:
  push:
    branches:
      - agent/live-module-workbench

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize, validate, and publish clean offscreen runtime branch
        env:
          TARGET_BRANCH: agent/hara-chrome-offscreen-runtime-133
          PAYLOAD_SHA256: 2fe215cef1e07b5a842eb1060aa4d6928e25fada81dbd13a3c4e0d75d7165d11
        run: |
          set -euo pipefail
          target_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test -n "$target_head"

          cat .agent/hara-offscreen-runtime/part-*.b64 > /tmp/hara-offscreen-runtime.b64
          base64 --decode /tmp/hara-offscreen-runtime.b64 > /tmp/hara-offscreen-runtime.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/hara-offscreen-runtime.tar.gz | sha256sum --check -

          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          tar -xzf /tmp/hara-offscreen-runtime.tar.gz

          rm -rf .agent/hara-control
          rm -f .github/workflows/agent-hara-control-materialize.yml

          for file in extension/hara-chrome/src/*.js extension/hara-chrome/test/*.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('extension/hara-chrome/manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['minimum_chrome_version'] == '116'
          assert manifest['action']['default_popup'] == 'src/popup.html'
          assert manifest['background']['service_worker'] == 'src/background.js'
          assert 'offscreen' in manifest['permissions']
          assert 'content_scripts' not in manifest

          host = Path('extension/hara-chrome/src/runtime-host.html').read_text()
          assert '<script type="module" src="./runtime-host.js"></script>' in host
          assert '<iframe' not in host.lower()

          panel = Path('extension/hara-chrome/src/panel.js').read_text()
          for forbidden in ['createBrowserBroker', 'new GraphHost', 'new SessionRouter', 'vendor/hara.wasm', 'vendor/hta-worker.js']:
              assert forbidden not in panel, forbidden
          PY

          cd extension/hara-chrome
          npm ci
          make test-fast
          npx playwright test --list test/offscreen-runtime.spec.js
          cd ../..

          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move hara-chrome runtime into an offscreen host"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$target_head" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
