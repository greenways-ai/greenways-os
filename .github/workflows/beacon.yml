name: Materialize Hara CDP Overlay diagnostics

on:
  push:
    branches:
      - agent/hara-chrome-cdp-overlay-diagnostics-materializer-138
  pull_request:
    branches:
      - agent/hara-chrome-cdp-overlay-diagnostics-trigger-138
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate, clean the accidental transport merge, and publish source
        env:
          TARGET_BRANCH: agent/hara-chrome-cdp-overlay-diagnostics-138
          EXPECTED_TARGET: 3810dba1cbe8e76e93def5cc7b9bf3e2d61088a9
          EXPECTED_MAIN: d62996678ffc5f7b3ffadd5c6ad264861d51f231
          CLEAN_BEACON_REF: 3810dba1cbe8e76e93def5cc7b9bf3e2d61088a9
          PAYLOAD_SHA256: d08b5ff9195ac9bb1ce5ab1e064ee7d246a921936983002d3bf58dc00ad50ff9
        run: |
          set -euo pipefail

          target_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$target_head" = "$EXPECTED_TARGET"

          cat .agent/hara-cdp-overlay-diagnostics/payload.b64.chunk-* > /tmp/diagnostics.b64
          base64 --decode /tmp/diagnostics.b64 > /tmp/diagnostics.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/diagnostics.tar.gz | sha256sum --check -

          git fetch origin main
          base="$(git rev-parse origin/main)"
          test "$base" = "$EXPECTED_MAIN"
          git reset --hard "$base"
          git clean -fdx
          tar -xzf /tmp/diagnostics.tar.gz

          rm -rf .agent/hara-cdp-overlay-diagnostics
          rm -f .github/workflows/agent-hara-cdp-overlay-diagnostics.yml
          git show "$CLEAN_BEACON_REF:.github/workflows/beacon.yml" > .github/workflows/beacon.yml

          cat > /tmp/expected-files <<'EOF'
          .agent/hara-cdp-overlay-diagnostics/payload.b64.chunk-00
          .agent/hara-cdp-overlay-diagnostics/payload.b64.chunk-01
          .agent/hara-cdp-overlay-diagnostics/payload.b64.chunk-02
          .agent/hara-cdp-overlay-diagnostics/payload.b64.chunk-03
          .agent/hara-cdp-overlay-diagnostics/trigger.txt
          .github/workflows/agent-hara-cdp-overlay-diagnostics.yml
          .github/workflows/beacon.yml
          extension/hara-chrome/Makefile
          extension/hara-chrome/docs/control-popup.md
          extension/hara-chrome/docs/diagnostics.md
          extension/hara-chrome/mkdocs.yml
          extension/hara-chrome/src/background.js
          extension/hara-chrome/src/control-model.js
          extension/hara-chrome/src/control-supervisor.js
          extension/hara-chrome/src/diagnostics-service.js
          extension/hara-chrome/src/hara/diagnostics.hal
          extension/hara-chrome/src/popup-model.js
          extension/hara-chrome/src/popup.html
          extension/hara-chrome/src/popup.js
          extension/hara-chrome/src/runtime-host.js
          extension/hara-chrome/test/control-model.test.js
          extension/hara-chrome/test/control-supervisor.test.js
          extension/hara-chrome/test/diagnostics-configuration.test.js
          extension/hara-chrome/test/diagnostics-overlay.spec.js
          extension/hara-chrome/test/diagnostics-service.test.js
          extension/hara-chrome/test/offscreen-configuration.test.js
          EOF
          {
            git diff --name-only "$base" --
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          for file in extension/hara-chrome/src/*.js extension/hara-chrome/test/*.js; do
            node --check "$file"
          done
          python3 -m json.tool extension/hara-chrome/manifest.json >/dev/null
          make -n -C extension/hara-chrome help >/dev/null

          cd extension/hara-chrome
          npm ci
          make test-fast
          npx playwright test --list test/diagnostics-overlay.spec.js
          cd ../..

          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add bounded CDP Overlay diagnostics"
          source_head="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$target_head" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$source_head"
