name: Snapshot setup inspection source

on:
  push:
    branches:
      - agent/setup-inspection-snapshot-92
    paths:
      - .github/agent/setup-inspection-snapshot-92

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/setup-inspection-snapshot-92
          fetch-depth: 0
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git \
              --exclude=.github/workflows/snapshot-setup-inspection-92.yml \
              --exclude=.github/agent/setup-inspection-snapshot-92 \
              -czf /tmp/setup-inspection-92.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: setup-inspection-92-source
          path: /tmp/setup-inspection-92.tar.gz
          retention-days: 1
          if-no-files-found: error
