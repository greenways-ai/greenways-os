name: Format Hestia Status Implementation

on:
  push:
    branches:
      - agent/desktop-hestia-status-90-impl
    paths:
      - .github/agent/format-hestia-status-90

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Format Hestia status implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-hestia-status-90-impl
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Format and publish the source-only branch
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          rm -f .github/agent/format-hestia-status-90 \
            .github/workflows/format-hestia-status-90.yml
          git diff --check
          git config user.name "greenways-os-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Format Hestia import readiness"
          git push origin HEAD:agent/desktop-hestia-status-90-impl
