name: Snapshot Desktop setup service source

on:
  push:
    branches:
      - agent/desktop-setup-service-92-snapshot
    paths:
      - .github/agent/desktop-setup-service-92-snapshot

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-setup-service-92-snapshot
          fetch-depth: 0
      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/snapshot-desktop-setup-service-92.yml \
            --exclude=.github/agent/desktop-setup-service-92-snapshot \
            -czf /tmp/greenways-os-desktop-setup-service-92.tar.gz .
          sha256sum /tmp/greenways-os-desktop-setup-service-92.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: greenways-os-desktop-setup-service-92-source
          path: /tmp/greenways-os-desktop-setup-service-92.tar.gz
          retention-days: 1
          if-no-files-found: error
