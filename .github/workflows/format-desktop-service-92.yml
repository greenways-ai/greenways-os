name: Format Desktop service branch

on:
  push:
    branches:
      - agent/desktop-setup-daemon-service-92-apply
    paths:
      - .github/agent/format-desktop-service-92

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-setup-daemon-service-92-apply
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Apply exact rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/desktop-service-92-clean
          git switch -C agent/desktop-service-92-clean origin/agent/desktop-service-92-clean
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          git diff --check
          cat > /tmp/expected-files <<'FILES'
          crates/greenways-workspace-contracts/src/resource.rs
          crates/greenways-workspace-contracts/tests/limits.rs
          FILES
          sed -i 's/^          //' /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          git add -- $(cat /tmp/expected-files)
          git commit -m 'Format workspace contracts'
          git push origin HEAD:agent/desktop-service-92-clean
