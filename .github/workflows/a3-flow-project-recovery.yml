name: A3 Flow project recovery publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flow-project-foundation-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Format recovered Rust contracts
        run: cargo +1.85.1 fmt --all
      - name: Regenerate the exact closed compatibility findings
        run: |
          python3 - <<'PY'
          import json
          import runpy
          from pathlib import Path

          root = Path.cwd()
          checker = runpy.run_path(str(root / 'scripts/check-flow-build-foreman-inventory.py'))
          findings, forbidden, _counts = checker['scan_findings']()
          if forbidden:
              raise SystemExit('forbidden Build identity found:\n' + '\n'.join(forbidden))
          path = root / 'protocol/compatibility/flow-build-foreman-inventory-0-alpha.json'
          inventory = json.loads(path.read_text(encoding='utf-8'))
          inventory['findings'] = findings
          path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Validate the complete recovered contract
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test -p greenways-workspace-contracts --all-targets
          cargo +1.85.1 clippy -p greenways-workspace-contracts --all-targets -- -D warnings
          python3 scripts/check-flow-build-foreman-inventory.py
          python3 -m json.tool protocol/compatibility/flow-build-foreman-inventory-0-alpha.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-direct-work.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-buildout.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/operation-catalogue.json >/dev/null
          git diff --check
      - name: Enforce the bounded recovery surface
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/a3-flow-project-recovery.yml',
              'crates/greenways-workspace-contracts/src/flow.rs',
              'crates/greenways-workspace-contracts/src/lib.rs',
              'crates/greenways-workspace-contracts/tests/flow_project_contract.rs',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/project-direct-work.json',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/project-buildout.json',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/operation-catalogue.json',
              'docs/flow-project-contract.md',
              'protocol/compatibility/flow-build-foreman-inventory-0-alpha.json',
          }
          actual = {
              line
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main'], text=True
              ).splitlines()
              if line
          }
          if actual != allowed:
              raise SystemExit(
                  'recovery surface mismatch\nexpected: '
                  + repr(sorted(allowed))
                  + '\nactual: '
                  + repr(sorted(actual))
              )
          PY
      - name: Publish one self-cleaning recovery commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/greenways-workspace-contracts/src/flow.rs \
            crates/greenways-workspace-contracts/src/lib.rs \
            crates/greenways-workspace-contracts/tests/flow_project_contract.rs \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-direct-work.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-buildout.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/operation-catalogue.json \
            docs/flow-project-contract.md \
            protocol/compatibility/flow-build-foreman-inventory-0-alpha.json
          git rm .github/workflows/a3-flow-project-recovery.yml
          git diff --cached --check
          git commit -m "Publish the recovered Flow project foundation"
          git push origin HEAD:agent/flow-project-foundation-repair
