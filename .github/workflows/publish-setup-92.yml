name: Publish setup slice

on:
  push:
    branches: [agent/desktop-setup-daemon-service-92-apply]
    paths: [.github/agent/publish-setup-92]

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Build reviewed source
        shell: bash
        run: |
          set -euo pipefail
          find .github/agent -name 'desktop-setup-daemon-service-92.part-*' -type f | sort | xargs cat | tr -d '[:space:]' | base64 --decode | gzip -d > /tmp/source.patch
          git fetch origin main
          git switch --detach origin/main
          git switch -c agent/desktop-setup-service-92-clean
          git apply /tmp/source.patch
          git apply .github/agent/desktop-setup-daemon-service-92-fix-01.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/greenways-desktop-bridge/src/setup/tests.rs')
          text = path.read_text()
          text = text.replace(
              'let root = std::env::temp_dir().join(format!(\n            "greenways-desktop-setup-{label}-{}-{}",',
              'let root = PathBuf::from(format!(\n            "/tmp/gwds-{label}-{}-{}",',
              1,
          )
          path.write_text(text)
          path = Path('services/greenways-desktop-bridge/src/setup/mod.rs')
          text = path.read_text().replace(
              '    UnsupportedPlatform(String),\n',
              '    #[cfg_attr(target_os = "macos", allow(dead_code))]\n    UnsupportedPlatform(String),\n',
              1,
          )
          path.write_text(text)
          PY
          cargo +1.85.1 fmt --all
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          cd apps/greenways_desktop
          dart format lib test
          flutter analyze
          flutter test
          cd ../..
          git diff --check
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          git add Cargo.lock apps/greenways_desktop protocol/desktop-setup.md services/greenways-desktop-bridge
          git commit -m 'Add Desktop setup service installation'
          git push --force origin HEAD:agent/desktop-setup-service-92-clean
