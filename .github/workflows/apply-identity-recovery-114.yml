name: Fix identity recovery layout

on:
  push:
    branches:
      - agent/apply-identity-recovery-114

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-identity-recovery-114
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Fix, test, and publish responsive identity recovery card
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/greenways_desktop/lib/ui/setup_view.dart')
          source = path.read_text()
          anchor = "key: const Key('identity-setup-card'),"
          start = source.index(anchor)
          before = source[:start]
          card = source[start:]
          old = 'if (constraints.maxWidth < 700) {'
          if card.count(old) < 1:
              raise SystemExit('identity setup breakpoint not found')
          card = card.replace(old, 'if (constraints.maxWidth < 960) {', 1)
          path.write_text(before + card)
          PY

          dart format apps/greenways_desktop/lib/ui/setup_view.dart
          (
            cd apps/greenways_desktop
            flutter pub get
            flutter analyze
            flutter test test/desktop_shell_test.dart
          )
          git diff --check

          git config user.name "greenways-os-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/greenways_desktop/lib/ui/setup_view.dart
          git commit -m "Keep identity recovery actions responsive"
          git push origin HEAD:agent/desktop-identity-recovery-114
