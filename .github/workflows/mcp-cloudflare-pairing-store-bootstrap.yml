name: Durable MCP pairing bootstrap

on:
  push:
    branches:
      - agent/mcp-cloudflare-pairing-store-33

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run durable MCP pairing bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp-gateway/package-lock.json

      - name: Apply durable pairing integration
        run: |
          python .github/agent/mcp-cloudflare-pairing-store/apply.py
          python .github/agent/mcp-cloudflare-pairing-store/finish.py
          python .github/agent/mcp-cloudflare-pairing-store/fixture.py

      - name: Install MCP gateway dependencies
        working-directory: services/mcp-gateway
        run: npm ci

      - name: Run pairing, SQLite, and Worker checks
        working-directory: services/mcp-gateway
        run: npm run check

      - name: Verify repository patch
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/mcp-cloudflare-pairing-store
          rm -f .github/workflows/mcp-cloudflare-pairing-store-bootstrap.yml

      - name: Commit and push
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Add durable MCP pairing repository"
          git push origin HEAD:${GITHUB_REF_NAME}
