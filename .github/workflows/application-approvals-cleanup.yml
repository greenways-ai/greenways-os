name: Application approval cleanup

on:
  push:
    branches:
      - agent/greenwaysd-application-approvals-51

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run application approval cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary review machinery
        run: |
          rm -f .github/workflows/application-approvals-full-review.yml
          rm -f .github/agent/application-approvals-full-review-trigger
          rm -f .github/workflows/application-approvals-cleanup.yml
          rm -f .github/agent/application-approvals-cleanup-trigger
          rm -f .github/workflows/application-approval-inspect.yml
          rm -f .github/workflows/application-approval-inspect-commit.yml
          rm -f .github/workflows/application-approvals-bootstrap.yml
          rm -f .github/agent/application-approval-inspection.txt
          rm -f .github/agent/application-approval-inspect-trigger
          rm -f .github/agent/application-approval-inspect-commit-trigger
          rm -f .github/agent/application-approval-bootstrap-trigger
          rm -rf .github/agent/application-approvals

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Check Rust formatting
        run: cargo +1.85.1 fmt --all -- --check

      - name: Test Rust workspace
        run: cargo +1.85.1 test --workspace --all-targets

      - name: Lint Rust workspace
        run: cargo +1.85.1 clippy --workspace --all-targets -- -D warnings

      - name: Verify product-only patch
        run: |
          git diff --check
          if find .github -type f \( -name '*application-approval*' -o -name '*application-approvals*' \) -print -quit | grep -q .; then
            echo 'Temporary application-approval workflow artifacts remain' >&2
            find .github -type f \( -name '*application-approval*' -o -name '*application-approvals*' \) -print >&2
            exit 1
          fi

      - name: Commit and push clean tree
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Clean application approval review artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
