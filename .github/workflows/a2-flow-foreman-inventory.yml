name: A2 Flow Foreman materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flow-foreman-compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Materialize compatibility contract and evidence
        run: python3 .github/a2-run-fixed-materializer.py
      - uses: actions/upload-artifact@v4
        with:
          name: a2-flow-foreman-materialized
          path: a2-output
          if-no-files-found: error
