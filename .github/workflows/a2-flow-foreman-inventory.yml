name: Materialize A2 Flow compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flow-foreman-compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flow-foreman-compatibility
          fetch-depth: 0
      - name: Close the Build compatibility slot
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          suite_path = Path("crates/greenways-workspace-contracts/src/suite.rs")
          suite = suite_path.read_text(encoding="utf-8")
          old = "disposition: CompatibilityDisposition::InventoryRequired,"
          new = "disposition: CompatibilityDisposition::Absent,"
          if suite.count(old) != 1:
              raise SystemExit("expected exactly one open Build compatibility slot")
          suite_path.write_text(suite.replace(old, new), encoding="utf-8")

          test_path = Path("crates/greenways-workspace-contracts/tests/suite_gate0.rs")
          test = test_path.read_text(encoding="utf-8")
          old_test = "CompatibilityDisposition::InventoryRequired"
          new_test = "CompatibilityDisposition::Absent"
          if test.count(old_test) != 1:
              raise SystemExit("expected exactly one Gate 0 Build inventory assertion")
          test_path.write_text(test.replace(old_test, new_test), encoding="utf-8")

          fixture_path = Path(
              "crates/greenways-workspace-contracts/tests/fixtures/suite/current-suite.json"
          )
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          applications = fixture.get("applications")
          if not isinstance(applications, list) or len(applications) != 2:
              raise SystemExit("current suite fixture must contain exactly two applications")
          flow = applications[1]
          if flow.get("applicationId") != "flow":
              raise SystemExit("second current application must be Flow")
          compatibility = flow.get("compatibility")
          if not isinstance(compatibility, list) or len(compatibility) != 1:
              raise SystemExit("Flow must have exactly one compatibility slot")
          slot = compatibility[0]
          if slot.get("legacyApplicationId") != "build":
              raise SystemExit("Flow compatibility slot must belong to Build")
          slot["disposition"] = "absent"
          fixture_path.write_text(
              json.dumps(fixture, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          Path(".github/workflows/a2-flow-foreman-inventory.yml").unlink()
          PY
      - name: Install pinned Rust tools
        run: >-
          rustup toolchain install 1.85.1 --profile minimal
          --component rustfmt --component clippy
      - name: Format changed Rust contracts
        run: |
          rustfmt +1.85.1 --edition 2021 \
            crates/greenways-workspace-contracts/src/flow.rs \
            crates/greenways-workspace-contracts/src/suite.rs \
            crates/greenways-workspace-contracts/tests/flow_foreman_compatibility.rs \
            crates/greenways-workspace-contracts/tests/suite_gate0.rs
          cargo +1.85.1 fmt --all --check
      - name: Verify compatibility inventory
        run: python3 scripts/check-flow-foreman-compatibility.py
      - name: Test workspace contracts
        run: cargo +1.85.1 test -p greenways-workspace-contracts --all-targets
      - name: Lint workspace contracts
        run: cargo +1.85.1 clippy -p greenways-workspace-contracts --all-targets -- -D warnings
      - name: Commit materialized contracts
        run: |
          git diff --check
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No A2 materialization changes remain"
            exit 0
          fi
          git config user.name "greenways-agent"
          git config user.email "greenways-agent@users.noreply.github.com"
          git commit -m "Materialize Flow and Foreman compatibility contracts"
          git push origin HEAD:agent/flow-foreman-compatibility
