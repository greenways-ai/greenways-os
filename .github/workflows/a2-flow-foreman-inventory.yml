name: A2 branch materializer

on:
  push:
    branches:
      - agent/a2-flow-foreman-materialize

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a2-flow-foreman-materialize
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Materialize the current A2 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('.github/a2-materialize-flow-foreman-current.py')
          source = adapter.read_bytes()
          filename = str(adapter.resolve())
          adapter.unlink()
          exec(
              compile(source, filename, 'exec'),
              {'__file__': filename, '__name__': '__main__'},
          )
          PY
      - name: Verify the complete A2 contract
        run: |
          set -euo pipefail
          cargo +1.85.1 test \
            -p greenways-workspace-contracts \
            --test suite_gate0 \
            --test flow_foreman_compatibility
          cargo +1.85.1 fmt --all -- --check
          python3 -m json.tool \
            protocol/compatibility/flow-build-foreman-inventory-0-alpha.json \
            >/dev/null
          python3 scripts/check-flow-build-foreman-inventory.py
          git diff --check
      - name: Publish one self-cleaning commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf a2-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            crates/greenways-workspace-contracts/src/suite.rs \
            crates/greenways-workspace-contracts/tests/suite_gate0.rs \
            crates/greenways-workspace-contracts/tests/flow_foreman_compatibility.rs \
            crates/greenways-workspace-contracts/tests/fixtures/suite/current-suite.json \
            docs/fabric-architecture.md \
            docs/fabric-technology-map.md \
            docs/workspace-architecture.md \
            docs/flow-build-foreman-compatibility.md \
            protocol/compatibility/flow-build-foreman-inventory-0-alpha.json \
            scripts/check-flow-build-foreman-inventory.py
          git rm \
            .github/a2-materialize-flow-foreman.py \
            .github/a2-materialize-flow-foreman-current.py \
            .github/workflows/a2-flow-foreman-inventory.yml
          git diff --cached --check
          git commit -m "Complete Flow and Foreman compatibility contract"
          git push origin HEAD:agent/a2-flow-foreman-materialize
