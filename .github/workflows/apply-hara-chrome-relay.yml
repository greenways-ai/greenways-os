name: Apply Hara Chrome relay implementation

on:
  push:
    branches:
      - agent/hara-chrome-relay-client-168

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hara-chrome-relay-client-168
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/hara-chrome/package-lock.json
      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/relay-patch/part-00 \
              .github/relay-patch/part-01 \
              .github/relay-patch/part-02 > /tmp/hara-chrome-relay.patch.gz.b64
          base64 --decode /tmp/hara-chrome-relay.patch.gz.b64 \
            | gzip --decompress > /tmp/hara-chrome-relay.patch
          echo '048816e058b7d960e8ad5d275acb89a36fc96ab47ccb419fb5e3dd7e01069800  /tmp/hara-chrome-relay.patch' \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all /tmp/hara-chrome-relay.patch
          git apply --whitespace=error-all /tmp/hara-chrome-relay.patch
      - name: Remove temporary materialization files
        shell: bash
        run: |
          rm -rf .github/relay-patch
          rm -f .github/workflows/apply-hara-chrome-relay.yml
          rm -f .github/workflows/export-hara-chrome-relay-workspace.yml
      - name: Install locked Hara Chrome dependencies
        working-directory: extension/hara-chrome
        run: npm ci --ignore-scripts
      - name: Validate relay implementation
        working-directory: extension/hara-chrome
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/remote-host-protocol.test.js \
            test/remote-host-client.test.js \
            test/remote-host-boundary.test.js
          make test-fast
          node --check src/remote-host-protocol.js
          node --check src/remote-host-client.js
          node --check test/remote-host-fixtures.js
          node --check test/remote-host-protocol.test.js
          node --check test/remote-host-client.test.js
          node --check test/remote-host-boundary.test.js
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8'))"
      - name: Check patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/relay-patch
          test ! -e .github/workflows/apply-hara-chrome-relay.yml
          test ! -e .github/workflows/export-hara-chrome-relay-workspace.yml
      - name: Commit product source
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- .github extension/hara-chrome
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add Hara Chrome outbound relay host client"
          git push origin HEAD:agent/hara-chrome-relay-client-168
