name: Snapshot provider authority source

on:
  push:
    branches:
      - agent/greenwaysd-provider-invoke-authority-78
    paths:
      - .github/agent/provider-authority-78-snapshot

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Snapshot provider authority source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-provider-invoke-authority-78
          fetch-depth: 0

      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/snapshot-provider-authority-78.yml \
            --exclude=.github/agent/provider-authority-78-snapshot \
            -czf /tmp/greenways-os-provider-authority-78.tar.gz .
          sha256sum /tmp/greenways-os-provider-authority-78.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: greenways-os-provider-authority-78-source
          path: /tmp/greenways-os-provider-authority-78.tar.gz
          retention-days: 1
          if-no-files-found: error
