name: A2 main workspace export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flow-foreman-compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Archive the exact main workspace
        run: tar --exclude=.git -czf /tmp/greenways-os-main.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: a2-main-workspace
          path: /tmp/greenways-os-main.tgz
          if-no-files-found: error
