name: Committed application approval inspection

on:
  push:
    branches:
      - agent/greenwaysd-application-approvals-51

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.head_commit.message == 'Commit application approval inspection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record exact seams
        run: |
          {
            echo '=== identity capability subject and signer ==='
            grep -n -A180 -B30 -E 'pub enum CapabilitySubject|pub struct CapabilitySubject|pub enum ProfileSignSubject|pub trait ProfileSigner|TestProfileIdentityVault' crates/greenways-identity/src/lib.rs
            echo '=== identity payload and test support ==='
            grep -n -A180 -B30 -E 'fn subject_payload|test-support|MemoryProfile|TestProfile' crates/greenways-identity/src/lib.rs
            echo '=== capability validation and tests ==='
            grep -n -A120 -B30 -E 'fn .*capabil|CAPABIL|mod tests|TestProfileIdentityVault|ProfileIdentityVault' crates/greenways-capabilities/src/lib.rs
          } > .github/agent/application-approval-inspection.txt
      - name: Commit inspection
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add .github/agent/application-approval-inspection.txt
          git commit -m "Record application approval inspection"
          git push origin HEAD:${GITHUB_REF_NAME}
