name: Export Desktop daemon setup source

on:
  push:
    branches:
      - agent/desktop-setup-daemon-service-92-apply
    paths:
      - .github/agent/desktop-setup-daemon-service-92-apply

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-setup-daemon-service-92-apply
          fetch-depth: 0
      - name: Reconstruct and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          names = (
              'part-00', 'part-01',
              'part-02a', 'part-02b', 'part-02c', 'part-02d',
              'part-03a', 'part-03b', 'part-03c', 'part-03d',
              'part-04a', 'part-04b', 'part-04c', 'part-04d',
              'part-05a', 'part-05b',
          )
          encoded = b''.join(
              b''.join(Path(f'.github/agent/desktop-setup-daemon-service-92.{name}').read_bytes().split())
              for name in names
          )
          assert len(encoded) == 43756
          assert hashlib.sha256(encoded).hexdigest() == 'f2723dcec922a6221ced94e6c67951e2c26427c0be5f88619210e3141ddebb8d'
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == 32817
          assert hashlib.sha256(archive).hexdigest() == 'f0cf7f6ddaf14287f3d6948a5edc436f938b139e82a556a2c1f602143643ce3a'
          patch = gzip.decompress(archive)
          assert len(patch) == 181360
          assert hashlib.sha256(patch).hexdigest() == '59dc1a5b110adac6a0d827f2605372faf7a2d57bce7aa6e3b156fe1b46b6a6ba'
          Path('/tmp/desktop-setup-daemon-service-92.patch').write_bytes(patch)

          fix = Path('.github/agent/desktop-setup-daemon-service-92-fix-01.patch').read_bytes()
          assert len(fix) == 4722
          assert hashlib.sha256(fix).hexdigest() == '95b66966bfc53349bf55791acddc85e0531fd8c7e480f50f6aed211da27110c5'
          Path('/tmp/desktop-setup-daemon-service-92-fix-01.patch').write_bytes(fix)
          PY

          git fetch origin main
          git switch --detach origin/main
          git apply --check /tmp/desktop-setup-daemon-service-92.patch
          git apply /tmp/desktop-setup-daemon-service-92.patch
          git apply --check /tmp/desktop-setup-daemon-service-92-fix-01.patch
          git apply /tmp/desktop-setup-daemon-service-92-fix-01.patch
          tar -czf /tmp/greenways-os-desktop-setup-daemon-service-92-patched.tar.gz \
            --exclude=.git \
            --exclude=.github/agent \
            --exclude=.github/workflows/apply-desktop-setup-daemon-service-92.yml \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: greenways-os-desktop-setup-daemon-service-92-patched
          path: /tmp/greenways-os-desktop-setup-daemon-service-92-patched.tar.gz
          retention-days: 1
          if-no-files-found: error
