name: Apply Desktop daemon setup service

on:
  push:
    branches:
      - agent/desktop-setup-daemon-service-92-apply
    paths:
      - .github/agent/desktop-setup-daemon-service-92-apply

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-setup-daemon-service-92-apply
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Verify and reconstruct the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          names = (
              'part-00',
              'part-01',
              'part-02a',
              'part-02b',
              'part-02c',
              'part-02d',
              'part-03a',
              'part-03b',
              'part-03c',
              'part-03d',
              'part-04a',
              'part-04b',
              'part-04c',
              'part-04d',
              'part-05a',
              'part-05b',
          )
          encoded = b''.join(
              b''.join(
                  Path(f'.github/agent/desktop-setup-daemon-service-92.{name}')
                  .read_bytes()
                  .split()
              )
              for name in names
          )
          assert len(encoded) == 43756
          assert hashlib.sha256(encoded).hexdigest() == 'f2723dcec922a6221ced94e6c67951e2c26427c0be5f88619210e3141ddebb8d'
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == 32817
          assert hashlib.sha256(archive).hexdigest() == 'f0cf7f6ddaf14287f3d6948a5edc436f938b139e82a556a2c1f602143643ce3a'
          patch = gzip.decompress(archive)
          assert len(patch) == 181360
          assert hashlib.sha256(patch).hexdigest() == '59dc1a5b110adac6a0d827f2605372faf7a2d57bce7aa6e3b156fe1b46b6a6ba'
          Path('/tmp/desktop-setup-daemon-service-92.patch').write_bytes(patch)
          fix = Path(
              '.github/agent/desktop-setup-daemon-service-92-fix-01.patch'
          ).read_bytes()
          assert len(fix) == 4722
          assert hashlib.sha256(fix).hexdigest() == '95b66966bfc53349bf55791acddc85e0531fd8c7e480f50f6aed211da27110c5'
          Path('/tmp/desktop-setup-daemon-service-92-fix-01.patch').write_bytes(fix)
          PY
      - name: Apply, format, and validate the source slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          git switch -c agent/desktop-setup-daemon-service-92-impl
          git apply --check /tmp/desktop-setup-daemon-service-92.patch
          git apply /tmp/desktop-setup-daemon-service-92.patch
          git apply --check /tmp/desktop-setup-daemon-service-92-fix-01.patch
          git apply /tmp/desktop-setup-daemon-service-92-fix-01.patch

          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings

          cd apps/greenways_desktop
          flutter config --enable-macos-desktop
          tool/build_macos.sh
          cd ../..

          git diff --check
          cat > /tmp/expected-files <<'FILES'
          Cargo.lock
          apps/greenways_desktop/README.md
          apps/greenways_desktop/lib/controller/setup_controller.dart
          apps/greenways_desktop/lib/main.dart
          apps/greenways_desktop/lib/model/setup_snapshot.dart
          apps/greenways_desktop/lib/model/setup_snapshot_types.dart
          apps/greenways_desktop/lib/model/setup_snapshot_validation.dart
          apps/greenways_desktop/lib/services/desktop_bridge.dart
          apps/greenways_desktop/lib/services/platform_shell.dart
          apps/greenways_desktop/lib/ui/greenways_app.dart
          apps/greenways_desktop/lib/ui/presentation.dart
          apps/greenways_desktop/lib/ui/setup_view.dart
          apps/greenways_desktop/lib/ui/setup_view_components.dart
          apps/greenways_desktop/lib/ui/shell.dart
          apps/greenways_desktop/test/desktop_shell_test.dart
          apps/greenways_desktop/test/setup_controller_test.dart
          apps/greenways_desktop/test/setup_snapshot_test.dart
          apps/greenways_desktop/test/support/fakes.dart
          apps/greenways_desktop/tool/build_macos.sh
          apps/greenways_desktop/tool/templates/build_desktop_bridge.sh
          protocol/desktop-setup.md
          services/greenways-desktop-bridge/Cargo.toml
          services/greenways-desktop-bridge/src/main.rs
          services/greenways-desktop-bridge/src/setup/host.rs
          services/greenways-desktop-bridge/src/setup/inspect.rs
          services/greenways-desktop-bridge/src/setup/mod.rs
          services/greenways-desktop-bridge/src/setup/service.rs
          services/greenways-desktop-bridge/src/setup/tests.rs
          FILES
          sed -i '' 's/^          //' /tmp/expected-files
          xargs git add -N -- < /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git status --porcelain | grep '^??' || true)"
      - name: Publish the clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'greenways-os-ci'
          git config user.email 'actions@users.noreply.github.com'
          xargs git add -- < /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/staged-files
          diff -u /tmp/expected-files /tmp/staged-files
          git commit -m 'Add Desktop daemon setup service'
          git push origin HEAD:refs/heads/agent/desktop-setup-daemon-service-92-impl
          git rev-parse HEAD
