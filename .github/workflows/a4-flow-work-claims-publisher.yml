name: A4 Flow work claims publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/flow-work-claims'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Add the closed work-claim mandate capability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('crates/greenways-workspace-contracts/src/flow_participation.rs')
          source = source_path.read_text(encoding='utf-8')
          old = '    WorkTransition,\n    BuildoutRead,'
          new = '    WorkTransition,\n    WorkClaim,\n    BuildoutRead,'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one mandate capability insertion point')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('crates/greenways-workspace-contracts/tests/flow_work_coordination.rs')
          test = test_path.read_text(encoding='utf-8')
          old_import = (
              'flow_work_coordination_operation_catalogue, CurrentApplicationId, '
              'FlowAgentMandateState,'
          )
          new_import = (
              'flow_work_coordination_operation_catalogue, CurrentApplicationId, '
              'FlowAgentMandateCapability, FlowAgentMandateState,'
          )
          if test.count(old_import) != 1:
              raise SystemExit('expected exactly one test import insertion point')
          test = test.replace(old_import, new_import, 1)
          if test.count('fn coordination(') != 1:
              raise SystemExit('expected exactly one coordination fixture helper')
          if test.count('fn participation()') != 1:
              raise SystemExit('expected exactly one participation fixture helper')
          test = test.replace('fn coordination(', 'fn coordination_fixture(', 1)
          test = test.replace('fn participation()', 'fn participation_fixture()', 1)
          test = test.replace('coordination(', 'coordination_fixture(')
          test = test.replace('participation()', 'participation_fixture()')
          old_retain = '\n'.join([
              '    participation.agent_mandates[0]',
              '        .capabilities',
              '        .retain(|capability| format!("{capability:?}") != "WorkClaim");',
          ])
          new_retain = '\n'.join([
              '    participation.agent_mandates[0]',
              '        .capabilities',
              '        .retain(|capability| *capability != FlowAgentMandateCapability::WorkClaim);',
          ])
          if test.count(old_retain) != 1:
              raise SystemExit('expected exactly one work-claim test predicate')
          test = test.replace(old_retain, new_retain, 1)
          revoked_member = '\n'.join([
              '    participation.members[1].state = FlowProjectMemberState::Revoked;',
              '    participation.members[1].revoked_at_unix_ms = Some(1787274400000);',
          ])
          if test.count(revoked_member) != 1:
              raise SystemExit('expected exactly one coupled revoked membership test setup')
          test = test.replace(revoked_member + '\n', '', 1)
          test_path.write_text(test, encoding='utf-8')

          fixture_path = Path(
              'crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json'
          )
          fixture = fixture_path.read_text(encoding='utf-8')
          old_fixture = '        "work-transition",\n        "buildout-read"'
          new_fixture = '        "work-transition",\n        "work-claim",\n        "buildout-read"'
          if fixture.count(old_fixture) != 1:
              raise SystemExit('expected exactly one participation fixture capability insertion point')
          fixture_path.write_text(
              fixture.replace(old_fixture, new_fixture, 1),
              encoding='utf-8',
          )

          docs_path = Path('docs/flow-project-participation.md')
          docs = docs_path.read_text(encoding='utf-8')
          old_docs = 'work-transition\nbuildout-read'
          new_docs = 'work-transition\nwork-claim\nbuildout-read'
          if docs.count(old_docs) != 1:
              raise SystemExit('expected exactly one participation documentation insertion point')
          docs_path.write_text(docs.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY
      - name: Format the complete contract
        run: cargo +1.85.1 fmt --all
      - name: Remove the temporary publisher before closing evidence
        run: git rm .github/workflows/a4-flow-work-claims-publisher.yml
      - name: Regenerate exact compatibility findings
        run: |
          python3 - <<'PY'
          import json
          import runpy
          from pathlib import Path

          root = Path.cwd()
          checker = runpy.run_path(str(root / 'scripts/check-flow-build-foreman-inventory.py'))
          findings, forbidden, _counts = checker['scan_findings']()
          if forbidden:
              raise SystemExit('forbidden Build identity found:\n' + '\n'.join(forbidden))
          path = root / 'protocol/compatibility/flow-build-foreman-inventory-0-alpha.json'
          inventory = json.loads(path.read_text(encoding='utf-8'))
          inventory['findings'] = findings
          path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Validate the complete contract
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test -p greenways-workspace-contracts --all-targets
          cargo +1.85.1 clippy -p greenways-workspace-contracts --all-targets -- -D warnings
          python3 scripts/check-flow-build-foreman-inventory.py
          python3 -m json.tool protocol/compatibility/flow-build-foreman-inventory-0-alpha.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/work-claim-contention.json >/dev/null
          python3 -m json.tool crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination-operation-catalogue.json >/dev/null
          git diff --check
      - name: Enforce the exact review surface
        run: |
          python3 - <<'PY'
          import subprocess

          expected = {
              'crates/greenways-workspace-contracts/src/flow_participation.rs',
              'crates/greenways-workspace-contracts/src/flow_work_coordination.rs',
              'crates/greenways-workspace-contracts/src/lib.rs',
              'crates/greenways-workspace-contracts/tests/flow_work_coordination.rs',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination.json',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/work-claim-contention.json',
              'crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination-operation-catalogue.json',
              'docs/flow-project-participation.md',
              'docs/flow-work-coordination.md',
              'protocol/compatibility/flow-build-foreman-inventory-0-alpha.json',
          }
          actual = {
              line
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main'], text=True
              ).splitlines()
              if line
          }
          if actual != expected:
              raise SystemExit(
                  'A4.2 review surface mismatch\nexpected: '
                  + repr(sorted(expected))
                  + '\nactual: '
                  + repr(sorted(actual))
              )
          PY
      - name: Publish one self-cleaning contract commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/greenways-workspace-contracts/src/flow_participation.rs \
            crates/greenways-workspace-contracts/src/flow_work_coordination.rs \
            crates/greenways-workspace-contracts/src/lib.rs \
            crates/greenways-workspace-contracts/tests/flow_work_coordination.rs \
            crates/greenways-workspace-contracts/tests/fixtures/flow/project-participation.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/work-claim-contention.json \
            crates/greenways-workspace-contracts/tests/fixtures/flow/work-coordination-operation-catalogue.json \
            docs/flow-project-participation.md \
            docs/flow-work-coordination.md \
            protocol/compatibility/flow-build-foreman-inventory-0-alpha.json
          git diff --cached --check
          git commit -m "Publish Flow work dependencies assignments and claims"
          git push origin HEAD:agent/flow-work-claims
