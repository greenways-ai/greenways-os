name: Validate Greenways OS extension release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            services/packages/package-lock.json
            services/devtools-node/package-lock.json
      - run: npm ci
      - name: Validate tag and extension versions
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("manifest.json", "utf8"));
            const pkg = JSON.parse(await readFile("package.json", "utf8"));
            if (manifest.version !== pkg.version) throw new Error("Manifest and package versions differ");
            const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : null;
            if (tag && tag !== `v${manifest.version}`) throw new Error(`${tag} does not match v${manifest.version}`);
          '
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Test Home Link service
        working-directory: services/home-node
        run: npm test
      - name: Test identity service
        working-directory: services/identity
        run: npm test
      - name: Test package registry service
        working-directory: services/packages
        run: npm ci && npm test
      - name: Test DevTools native host
        working-directory: services/devtools-node
        run: npm ci && npm test
      - name: Build deterministic release assets
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run package:extension
          cd release
          sha256sum --check greenways-os-extension-v*.zip.sha256
          cd ..
          npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: greenways-os-extension-release
          path: |
            extension/release/greenways-os-extension-v*.zip
            extension/release/greenways-os-extension-v*.zip.sha256
            extension/release/greenways-os-extension-v*.json
          if-no-files-found: error
