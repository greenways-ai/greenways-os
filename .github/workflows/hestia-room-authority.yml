name: Verify Hestia room authority import

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: greenways-ai/hestia
          ref: 64707d7a38216d800bcc22b8da215c3e6946e1bb
          path: .imports/hestia
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate the reviewed Hestia room authority lock
        run: node extension/scripts/generate-hestia-room-authority-lock.mjs .imports/hestia --print
