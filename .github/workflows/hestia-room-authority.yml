name: Verify Hestia room authority import

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: greenways-ai/hestia
          ref: 64707d7a38216d800bcc22b8da215c3e6946e1bb
          path: .imports/hestia
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject Hestia room authority lock drift
        run: node extension/scripts/generate-hestia-room-authority-lock.mjs .imports/hestia --check
      - name: Verify pinned Hestia fixture and canonical record conformance
        run: node extension/scripts/verify-hestia-room-authority-import.mjs .imports/hestia
      - name: Reject canonical-path escape with unchanged artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          escaped="$(mktemp)"
          cp .imports/hestia/browser/src/room-authority.js "$escaped"
          rm .imports/hestia/browser/src/room-authority.js
          ln -s "$escaped" .imports/hestia/browser/src/room-authority.js

          if node extension/scripts/generate-hestia-room-authority-lock.mjs \
              .imports/hestia --check > /tmp/hestia-lock-escape.log 2>&1; then
            echo "lock generator accepted an escaped symbolic link" >&2
            exit 1
          fi
          grep -F \
            'decisionModule must not resolve through a symbolic link or escaped parent' \
            /tmp/hestia-lock-escape.log

          if node extension/scripts/verify-hestia-room-authority-import.mjs \
              .imports/hestia > /tmp/hestia-import-escape.log 2>&1; then
            echo "import verifier accepted an escaped symbolic link" >&2
            exit 1
          fi
          grep -F \
            'decisionModule must not resolve through a symbolic link or escaped parent' \
            /tmp/hestia-import-escape.log
