name: Flow Foreman compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Flow, Build, and Foreman compatibility inventory
        run: python3 scripts/check-flow-foreman-compatibility.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
