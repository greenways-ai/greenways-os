name: MCP pairing security review

on:
  push:
    branches:
      - agent/mcp-cloudflare-pairing-store-33

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run MCP pairing security review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp-gateway/package-lock.json

      - name: Apply reviewed fail-closed refinements
        run: python .github/agent/mcp-pairing-review/finish.py

      - name: Install MCP gateway dependencies
        working-directory: services/mcp-gateway
        run: npm ci

      - name: Run pairing, SQLite, and Worker checks
        working-directory: services/mcp-gateway
        run: npm run check

      - name: Verify repository patch
        run: git diff --check

      - name: Remove review bootstrap files
        run: |
          rm -rf .github/agent/mcp-pairing-review
          rm -f .github/workflows/mcp-pairing-review-bootstrap.yml

      - name: Commit and push
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Harden durable MCP pairing recovery"
          git push origin HEAD:${GITHUB_REF_NAME}
