name: Apply provider invocation authority

on:
  push:
    branches:
      - agent/greenwaysd-provider-invoke-authority-78
    paths:
      - .github/agent/provider-authority-78-run

permissions:
  contents: write

concurrency:
  group: apply-provider-authority-78
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run provider authority enforcement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-provider-invoke-authority-78
          fetch-depth: 0

      - name: Verify exact branch and base
        shell: bash
        run: |
          set -euo pipefail
          BASE='dd6fb3c29c4a446537027969372150f08f439975'
          HEAD_BEFORE="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$BASE" "$HEAD_BEFORE"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/snapshot-provider-authority-78.yml | \
              .github/agent/provider-authority-78-snapshot | \
              .github/agent/provider-authority-78/* | \
              .github/agent/provider-authority-78-v2/* | \
              .github/workflows/apply-provider-authority-78.yml | \
              .github/agent/provider-authority-78-run)
                ;;
              *)
                printf 'unexpected pre-apply path: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD_BEFORE")
          printf '%s\n' "$BASE" > /tmp/provider-authority-base
          printf '%s\n' "$HEAD_BEFORE" > /tmp/provider-authority-head-before

      - name: Reassemble and verify exact patch bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/agent/provider-authority-78-v2/part-00 | cut -d' ' -f1)" = '7d2085fc057f24a1759e36f6a55fca69102ccdfb304fd9971efb5585a17fe185'
          test "$(sha256sum .github/agent/provider-authority-78-v2/part-01 | cut -d' ' -f1)" = '6117d6426e8f3b0e2663b59eefca6bdef8afa2150c9d42f552a02ed320a415bd'
          test "$(sha256sum .github/agent/provider-authority-78-v2/part-02 | cut -d' ' -f1)" = 'e13d1ff99a37dab9a0c6fda6d2078d60c7ac88277d4752650d4c6290672bfe43'
          test "$(sha256sum .github/agent/provider-authority-78-v2/part-03 | cut -d' ' -f1)" = 'cd8ccbbba0cfe2f0437df43d8c7c1f1dc09daf9f1dff3c94c4401ef07df16833'
          test "$(sha256sum .github/agent/provider-authority-78-v2/part-04 | cut -d' ' -f1)" = '1ae122c4e52d7e3b9d4e5c276aadceed45f37cc5e3ecb4093dc972d610c0c1a4'
          cat \
            .github/agent/provider-authority-78-v2/part-00 \
            .github/agent/provider-authority-78-v2/part-01 \
            .github/agent/provider-authority-78-v2/part-02 \
            .github/agent/provider-authority-78-v2/part-03 \
            .github/agent/provider-authority-78-v2/part-04 \
            > /tmp/provider-authority-78.patch.gz.b64
          test "$(sha256sum /tmp/provider-authority-78.patch.gz.b64 | cut -d' ' -f1)" = 'f67d5a6d5c8a37b9aa0f7d8a9e78bda0af01dcc5773c1dccf916a12faf5a7dfe'
          base64 --decode /tmp/provider-authority-78.patch.gz.b64 > /tmp/provider-authority-78.patch.gz
          test "$(sha256sum /tmp/provider-authority-78.patch.gz | cut -d' ' -f1)" = '2cf90a4b43dc4f19200d98d4e6dd471f7f4f928275d979fe6cca214c3b6b1ea2'
          gzip --decompress --stdout /tmp/provider-authority-78.patch.gz > /tmp/provider-authority-78.patch
          test "$(sha256sum /tmp/provider-authority-78.patch | cut -d' ' -f1)" = 'b4d2c9b81231ef5f300474919d419d60ac554fee5b30b0c654a3c805c1926ec6'

      - name: Apply real source and remove all transport machinery
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/provider-authority-78.patch
          git apply /tmp/provider-authority-78.patch
          rm -rf .github/agent/provider-authority-78
          rm -rf .github/agent/provider-authority-78-v2
          rm -f .github/agent/provider-authority-78-snapshot
          rm -f .github/agent/provider-authority-78-run
          rm -f .github/workflows/snapshot-provider-authority-78.yml
          rm -f .github/workflows/apply-provider-authority-78.yml

      - name: Prove the final authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq 'greenways-authorised-provider-invocation/0-alpha' crates services cli protocol
          grep -R -Fq 'provider.profile-id' crates services cli protocol
          grep -R -Fq 'provider.model' crates services cli protocol
          grep -R -Fq 'provider.max-output-tokens' crates services cli protocol
          grep -R -Fq 'provider.max-timeout-ms' crates services cli protocol
          grep -Fq 'ProviderInvocationRequest::Legacy' services/greenwaysd/src/provider.rs
          grep -Fq 'provider-authority-required' services/greenwaysd/src/provider.rs
          grep -Fq 'fn provider_authority_denials_precede_claim_and_vault_access' services/greenwaysd/src/lib.rs
          grep -Fq 'LocalClientRole::BrowserBridge' services/greenwaysd/src/lib.rs
          grep -Fq 'authorized_at_unix_ms' services/greenwaysd/src/provider.rs
          grep -Fq 'historical_provider_evidence_survives_later_revocation_only_at_its_authorization_time' crates/greenways-capabilities/src/lib.rs
          grep -Fq 'completed_provider_receipts_replay_after_later_application_revocation' services/greenwaysd/src/lib.rs
          test ! -e .github/agent/provider-authority-78
          test ! -e .github/agent/provider-authority-78-v2
          test ! -e .github/agent/provider-authority-78-snapshot
          test ! -e .github/agent/provider-authority-78-run
          test ! -e .github/workflows/snapshot-provider-authority-78.yml
          test ! -e .github/workflows/apply-provider-authority-78.yml

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Format and validate the exact final source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Verify final file inventory and write one clean commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/provider-authority-base)"
          HEAD_BEFORE="$(cat /tmp/provider-authority-head-before)"
          git config user.name 'greenways-os-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          cat > /tmp/provider-authority-expected-files <<'EOF'
          Cargo.lock
          cli/greenways-admin/src/main.rs
          cli/greenways/src/main.rs
          crates/greenways-applications/src/lib.rs
          crates/greenways-capabilities/Cargo.toml
          crates/greenways-capabilities/src/lib.rs
          crates/greenways-identity/src/lib.rs
          crates/greenways-local/src/lib.rs
          crates/greenways-protocol/src/lib.rs
          crates/greenways-provider/src/lib.rs
          crates/greenways-vault/Cargo.toml
          crates/greenways-vault/src/lib.rs
          protocol/capability-grants.md
          protocol/daemon.md
          protocol/local-clients.md
          protocol/provider-invoke.md
          protocol/provider-vault.md
          services/greenwaysd/Cargo.toml
          services/greenwaysd/README.md
          services/greenwaysd/src/lib.rs
          services/greenwaysd/src/provider.rs
          EOF
          sed -i 's/^          //' /tmp/provider-authority-expected-files
          sort -o /tmp/provider-authority-expected-files /tmp/provider-authority-expected-files
          git diff --cached --name-only "$BASE" | sort > /tmp/provider-authority-actual-files
          diff -u /tmp/provider-authority-expected-files /tmp/provider-authority-actual-files
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n\n%s\n' \
            'Enforce application authority before provider invocation' \
            'Require exact signed application approval and typed model/generate grant policy before provider claim ownership, vault lookup, credential access, or network execution. Preserve attributable replay evidence and legacy claim fencing. Refs #51. Closes #78.' \
            | git commit-tree "$TREE" -p "$BASE")"
          git push \
            --force-with-lease="refs/heads/agent/greenwaysd-provider-invoke-authority-78:$HEAD_BEFORE" \
            origin "$COMMIT:refs/heads/agent/greenwaysd-provider-invoke-authority-78"
          printf '%s\n' "$COMMIT"
