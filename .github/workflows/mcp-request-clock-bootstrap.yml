name: MCP request-store clock alignment

on:
  push:
    branches:
      - agent/mcp-atomic-request-claims-33

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run MCP request-store clock alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp-gateway/package-lock.json

      - name: Align request-store clocks
        run: python .github/agent/mcp-request-clock/apply.py

      - name: Install MCP gateway dependencies
        working-directory: services/mcp-gateway
        run: npm ci

      - name: Run MCP gateway checks
        working-directory: services/mcp-gateway
        run: npm run check

      - name: Verify repository patch
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/mcp-request-clock
          rm -f .github/workflows/mcp-request-clock-bootstrap.yml

      - name: Commit and push
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Align MCP request-store clocks"
          git push origin HEAD:${GITHUB_REF_NAME}
