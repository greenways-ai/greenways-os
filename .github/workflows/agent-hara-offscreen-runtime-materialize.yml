name: Materialize shared Hara offscreen runtime

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/hara-chrome-offscreen-runtime-133'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize, validate, and publish clean source branch
        env:
          BRANCH: agent/hara-chrome-offscreen-runtime-133
          PAYLOAD_SHA256: 139d092b10df43e2ee234f985483c54c54650fce3f08aaa59fad44f7fc8f575f
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          git fetch origin main
          base="$(git rev-parse origin/main)"

          cp .agent/hara-offscreen-runtime/payload.tar.gz /tmp/hara-offscreen-runtime.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/hara-offscreen-runtime.tar.gz | sha256sum --check -

          git reset --hard "$base"
          git clean -fdx
          tar -xzf /tmp/hara-offscreen-runtime.tar.gz

          rm -f .agent/hara-control/payload.b64
          rmdir .agent/hara-control 2>/dev/null || true
          rm -f .github/workflows/agent-hara-control-materialize.yml

          node --check extension/hara-chrome/src/*.js
          node --check extension/hara-chrome/test/*.js
          python3 -m json.tool extension/hara-chrome/manifest.json >/dev/null
          make -n -C extension/hara-chrome help >/dev/null

          # Generated vendor assets are absent in a clean source checkout. The
          # focused codec/client tests need only the HTA marker classes; full
          # build CI replaces this temporary fixture with canonical vendor/.
          mkdir -p extension/hara-chrome/vendor
          cat > extension/hara-chrome/vendor/hta.js <<'EOF'
          export class HtaKeyword { constructor(name) { this.name = name; } }
          export class HtaSymbol { constructor(name) { this.name = name; } }
          export class HtaHandle {
            constructor(owner = null, type = null, id = 0n) {
              this.owner = owner;
              this.type = type;
              this.id = BigInt(id);
            }
            toString() { return `#ht[:handle ${this.id}]`; }
          }
          EOF

          node --test \
            extension/hara-chrome/test/control-model.test.js \
            extension/hara-chrome/test/control-supervisor.test.js \
            extension/hara-chrome/test/host-bridge-codec.test.js \
            extension/hara-chrome/test/offscreen-configuration.test.js \
            extension/hara-chrome/test/runtime-client.test.js \
            extension/hara-chrome/test/runtime-host-core.test.js \
            extension/hara-chrome/test/runtime-supervisor.test.js

          rm -rf extension/hara-chrome/vendor
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move hara-chrome runtime offscreen"
          git push \
            --force-with-lease="refs/heads/$BRANCH:$old_head" \
            origin "HEAD:refs/heads/$BRANCH"
