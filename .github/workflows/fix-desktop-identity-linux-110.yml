name: Fix Desktop identity Linux fixture

on:
  push:
    branches:
      - agent/desktop-identity-110-apply
    paths:
      - .github/agent/fix-desktop-identity-linux-110

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-identity-110
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Close the temporary executable before identity inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('services/greenways-desktop-bridge/src/setup/tests.rs')
          text = path.read_text()
          old = '''        file.sync_all().expect("script sync");
        #[cfg(unix)]
        fs::set_permissions(&packaged_daemon, fs::Permissions::from_mode(0o755))
'''
          new = '''        file.sync_all().expect("script sync");
        drop(file);
        #[cfg(unix)]
        fs::set_permissions(&packaged_daemon, fs::Permissions::from_mode(0o755))
'''
          if text.count(old) != 1:
              raise SystemExit('temporary daemon fixture source changed')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check
      - name: Amend the reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          test "$(git diff --name-only)" = 'services/greenways-desktop-bridge/src/setup/tests.rs'
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          git add services/greenways-desktop-bridge/src/setup/tests.rs
          git commit --amend --no-edit
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          git push --force-with-lease origin HEAD:refs/heads/agent/desktop-identity-110
          git rev-parse HEAD
