name: Fix Desktop identity Linux fixture

on:
  push:
    branches:
      - agent/desktop-identity-110-apply
    paths:
      - .github/agent/fix-desktop-identity-linux-110-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-identity-110
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Validate the complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/desktop-identity-110-apply:.github/agent/fix-desktop-identity-linux-110.py > /tmp/fix-desktop-identity-linux-110.py
          python3 /tmp/fix-desktop-identity-linux-110.py
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check
      - name: Amend the reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          cat > /tmp/expected-fix-files <<'FILES'
          crates/greenways-workspace-contracts/tests/limits.rs
          services/greenways-desktop-bridge/src/setup/tests.rs
          FILES
          git diff --name-only | sort > /tmp/actual-fix-files
          diff -u /tmp/expected-fix-files /tmp/actual-fix-files
          git config user.name greenways-os-ci
          git config user.email actions@users.noreply.github.com
          xargs git add -- < /tmp/expected-fix-files
          git commit --amend --no-edit
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          git push --force origin HEAD:refs/heads/agent/desktop-identity-110
          git rev-parse HEAD
