name: Offline capability administration bootstrap

on:
  push:
    branches:
      - agent/greenwaysd-capability-admin-v2-51

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run offline capability administration bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-capability-admin-v2-51
          fetch-depth: 0

      - name: Reconcile the current identity import shape
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cli/greenways-admin/src/main.rs')
          text = path.read_text()
          current = 'use greenways_identity::{ProfileIdentityStatus, ProfileIdentityVault, SignedProfileIdentity};\n'
          expected = (
              'use greenways_identity::{\n'
              '    ProfileIdentityStatus, ProfileIdentityVault, SignedProfileIdentity,\n'
              '};\n'
          )
          if text.count(current) != 1:
              raise SystemExit('current identity import anchor was not found exactly once')
          path.write_text(text.replace(current, expected, 1))
          PY

      - name: Apply offline signed capability administration
        run: python3 .github/agent/capability-admin-v2/apply.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Validate exact final source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/capability-admin-v2
          rm -f .github/workflows/capability-admin-v2-bootstrap.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'greenways-os-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add offline signed capability administration' -m 'Issue and revoke exact signed application grants while greenwaysd is stopped. Refs #51.'
          git push origin HEAD:agent/greenwaysd-capability-admin-v2-51
