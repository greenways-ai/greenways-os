name: Materialize hara toolbar control

on:
  push:
    branches:
      - agent/hara-chrome-toolbar-control-133

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize, validate, and publish clean branch
        env:
          BRANCH: agent/hara-chrome-toolbar-control-133
          PAYLOAD_SHA256: 301060b3631f9fb4a6d85e8c44d09d9a3947ccb192cb32896e397c20593cd309
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          base="$(git rev-parse origin/main)"

          base64 --decode .agent/hara-control/payload.b64 > /tmp/hara-control-payload.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/hara-control-payload.tar.gz | sha256sum --check -
          tar -xzf /tmp/hara-control-payload.tar.gz

          rm -rf .agent/hara-control
          rm .github/workflows/agent-hara-control-materialize.yml

          node --check extension/hara-chrome/src/background.js
          node --check extension/hara-chrome/src/control-supervisor.js
          node --check extension/hara-chrome/src/panel-control.js
          node --check extension/hara-chrome/src/panel.js
          node --check extension/hara-chrome/src/popup-model.js
          node --check extension/hara-chrome/src/popup.js
          node --check extension/hara-chrome/test/control-configuration.test.js
          node --check extension/hara-chrome/test/control-popup.spec.js
          node --check extension/hara-chrome/test/control-supervisor.test.js
          node --check extension/hara-chrome/test/panel-control.test.js
          node --check extension/hara-chrome/test/popup-model.test.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('extension/hara-chrome/manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['action']['default_popup'] == 'src/popup.html'
          assert 'content_scripts' not in manifest

          popup = Path('extension/hara-chrome/src/popup.html').read_text()
          assert popup.count('role="switch"') == 4
          assert '<iframe' not in popup.lower()
          assert '<script type="module" src="./popup.js"></script>' in popup
          PY

          cd extension/hara-chrome
          npm ci
          make test-fast
          npx playwright test --list test/control-popup.spec.js
          cd ../..

          git reset "$base"
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add hara-chrome toolbar connection control"
          git push \
            --force-with-lease="refs/heads/$BRANCH:$old_head" \
            origin "HEAD:refs/heads/$BRANCH"
