name: Application approval boundary inspection

on:
  push:
    branches:
      - agent/greenwaysd-application-approvals-51

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect application approval boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact identity and capability seams
        run: |
          echo '=== identity declarations ==='
          grep -n -E 'CapabilitySubject|ProfileSignSubject|subject_payload|verify_signed_profile_identity' crates/greenways-identity/src/lib.rs
          echo '=== identity subject region ==='
          start=$(grep -n 'pub enum ProfileSignSubject' crates/greenways-identity/src/lib.rs | head -1 | cut -d: -f1)
          sed -n "$((start-40)),$((start+180))p" crates/greenways-identity/src/lib.rs
          echo '=== capability declarations ==='
          grep -n -E 'CAPABILITY|capability|validate_|normalize_' crates/greenways-capabilities/src/lib.rs | head -160
          echo '=== capability source beginning ==='
          sed -n '1,280p' crates/greenways-capabilities/src/lib.rs
