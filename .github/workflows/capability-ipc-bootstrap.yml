name: Capability authority daemon read bootstrap

on:
  push:
    branches:
      - agent/greenwaysd-capability-authority-ipc-51

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run capability authority daemon read bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply daemon read integration
        run: python .github/agent/capability-ipc/apply.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Format workspace
        run: cargo +1.85.1 fmt --all

      - name: Test workspace
        run: cargo +1.85.1 test --workspace --all-targets

      - name: Lint workspace
        run: cargo +1.85.1 clippy --workspace --all-targets -- -D warnings

      - name: Verify patch
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/capability-ipc
          rm -f .github/workflows/capability-ipc-bootstrap.yml

      - name: Commit and push
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Wire signed capability reads into greenwaysd"
          git push origin HEAD:${GITHUB_REF_NAME}
