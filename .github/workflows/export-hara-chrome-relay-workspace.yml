name: Export Hara Chrome relay workspace

on:
  pull_request:
  push:
    branches:
      - agent/hara-chrome-relay-client-168

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/hara-chrome/package-lock.json
      - name: Install Hara Chrome locked dependencies
        working-directory: extension/hara-chrome
        run: npm ci --ignore-scripts
      - name: Create development archive
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='**/target' \
            --exclude='**/dist' \
            --exclude='**/.cache' \
            -czf /tmp/greenways-os-hara-chrome-development.tar.gz .
      - name: Upload development archive
        uses: actions/upload-artifact@v4
        with:
          name: greenways-os-hara-chrome-development
          path: /tmp/greenways-os-hara-chrome-development.tar.gz
          if-no-files-found: error
