name: Extract provider authority transport

on:
  push:
    branches:
      - agent/greenwaysd-provider-invoke-authority-78
    paths:
      - .github/agent/provider-authority-78-extract

permissions:
  contents: read

jobs:
  extract:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Extract provider authority transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-provider-invoke-authority-78
          fetch-depth: 0

      - name: Package existing transport
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent/provider-authority-78/part-00 \
            .github/agent/provider-authority-78/part-01 \
            .github/agent/provider-authority-78/part-02 \
            > /tmp/provider-authority-78-old.patch.gz.b64
          sha256sum /tmp/provider-authority-78-old.patch.gz.b64
          base64 --decode /tmp/provider-authority-78-old.patch.gz.b64 > /tmp/provider-authority-78-old.patch.gz
          gzip --test /tmp/provider-authority-78-old.patch.gz
          gzip --decompress --stdout /tmp/provider-authority-78-old.patch.gz > /tmp/provider-authority-78-old.patch
          sha256sum /tmp/provider-authority-78-old.patch.gz /tmp/provider-authority-78-old.patch

      - uses: actions/upload-artifact@v4
        with:
          name: provider-authority-78-old-transport
          path: |
            /tmp/provider-authority-78-old.patch.gz.b64
            /tmp/provider-authority-78-old.patch.gz
            /tmp/provider-authority-78-old.patch
          retention-days: 1
          if-no-files-found: error
