name: Exact capability decision bootstrap

on:
  push:
    branches:
      - agent/greenwaysd-capability-check-51

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run exact capability decision bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenwaysd-capability-check-51
          fetch-depth: 0

      - name: Decode and apply the exact capability decision slice
        run: |
          base64 --decode .github/agent/capability-check/apply.py.gz.b64 | gzip --decompress > /tmp/capability-check-apply.py
          python3 /tmp/capability-check-apply.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy

      - name: Validate exact final source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 fmt --all
          cargo +1.85.1 fmt --all -- --check
          cargo +1.85.1 test --workspace --all-targets
          cargo +1.85.1 clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/capability-check
          rm -f .github/workflows/capability-check-bootstrap.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'greenways-os-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add exact authenticated capability decisions' -m 'Expose one actor-bound exact subject check without authority inventory or mutation. Refs #51.'
          git push origin HEAD:agent/greenwaysd-capability-check-51
