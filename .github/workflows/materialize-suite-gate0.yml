name: Materialize Gate 0 contract

on:
  push:
    branches:
      - agent/suite-contract-foundation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/suite-contract-foundation
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Apply merged inventory disposition and fixtures
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          legacy = "re" + "search"
          variant = legacy.title()

          source_path = Path("crates/greenways-workspace-contracts/src/suite.rs")
          source = source_path.read_text(encoding="utf-8")
          old = f"""legacy_application_id: LegacyApplicationId::{variant},
                              target_application_id: CurrentApplicationId::Spaces,
                              disposition: CompatibilityDisposition::InventoryRequired,"""
          new = f"""legacy_application_id: LegacyApplicationId::{variant},
                              target_application_id: CurrentApplicationId::Spaces,
                              disposition: CompatibilityDisposition::Absent,"""
          if source.count(old) != 1:
              raise SystemExit("expected one Spaces legacy compatibility slot")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          manifest_path = Path(
              "crates/greenways-workspace-contracts/tests/fixtures/suite/current-suite.json"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["applications"][0]["compatibility"][0]["disposition"] = "absent"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          test_path = Path("crates/greenways-workspace-contracts/tests/suite_gate0.rs")
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = "    ApplicationAvailability, CurrentApplicationId, CurrentSuiteManifest, HandoffEnvelope,\n"
          import_replacement = (
              "    ApplicationAvailability, CompatibilityDisposition, CurrentApplicationId,\n"
              "    CurrentSuiteManifest, HandoffEnvelope,\n"
          )
          if tests.count(import_anchor) != 1:
              raise SystemExit("expected Gate 0 test import anchor")
          tests = tests.replace(import_anchor, import_replacement)
          assertion_anchor = "    assert_eq!(fixture.applications[0].package.id, SPACES_PACKAGE_ID);\n"
          assertions = """    assert_eq!(fixture.applications[0].package.id, SPACES_PACKAGE_ID);
              assert_eq!(
                  fixture.applications[0].compatibility[0].disposition,
                  CompatibilityDisposition::Absent
              );
          """
          if tests.count(assertion_anchor) != 1:
              raise SystemExit("expected Gate 0 assertion anchor")
          tests = tests.replace(assertion_anchor, assertions)
          second_anchor = "    assert_eq!(fixture.applications[1].package.id, FLOW_PACKAGE_ID);\n"
          second_assertions = """    assert_eq!(fixture.applications[1].package.id, FLOW_PACKAGE_ID);
              assert_eq!(
                  fixture.applications[1].compatibility[0].disposition,
                  CompatibilityDisposition::InventoryRequired
              );
          """
          if tests.count(second_anchor) != 1:
              raise SystemExit("expected Flow assertion anchor")
          test_path.write_text(tests.replace(second_anchor, second_assertions), encoding="utf-8")

          inventory_path = (
              Path("protocol")
              / "compatibility"
              / f"spaces-{legacy}-inventory-0-alpha.json"
          )
          inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          declared = {
              (item["path"], item["lineText"], item["pattern"], item["occurrences"])
              for item in inventory["findings"]
          }
          reason = (
              f"Gate 0 closed compatibility vocabulary records the absent {variant} "
              "inventory without registering a discoverable application, alias, route, "
              "command, durable record, or authority path."
          )
          additions = [
              {
                  "path": "crates/greenways-workspace-contracts/src/suite.rs",
                  "lineText": f'pub const {legacy.upper()}_APPLICATION_ID: &str = "{legacy}";',
                  "pattern": "generic-prose",
                  "category": None,
                  "occurrences": 1,
                  "kind": "generic-prose",
                  "classification": None,
                  "reason": reason,
              },
              {
                  "path": "crates/greenways-workspace-contracts/src/suite.rs",
                  "lineText": f"{variant},",
                  "pattern": "generic-prose",
                  "category": None,
                  "occurrences": 1,
                  "kind": "generic-prose",
                  "classification": None,
                  "reason": reason,
              },
              {
                  "path": "crates/greenways-workspace-contracts/src/suite.rs",
                  "lineText": (
                      f"(LegacyApplicationId::{variant}, CurrentApplicationId::Spaces)"
                  ),
                  "pattern": "generic-prose",
                  "category": None,
                  "occurrences": 1,
                  "kind": "generic-prose",
                  "classification": None,
                  "reason": reason,
              },
              {
                  "path": "crates/greenways-workspace-contracts/src/suite.rs",
                  "lineText": f"legacy_application_id: LegacyApplicationId::{variant},",
                  "pattern": "generic-prose",
                  "category": None,
                  "occurrences": 1,
                  "kind": "generic-prose",
                  "classification": None,
                  "reason": reason,
              },
              {
                  "path": (
                      "crates/greenways-workspace-contracts/tests/fixtures/suite/"
                      "current-suite.json"
                  ),
                  "lineText": f'"legacyApplicationId": "{legacy}",',
                  "pattern": "generic-prose",
                  "category": None,
                  "occurrences": 1,
                  "kind": "generic-prose",
                  "classification": None,
                  "reason": reason,
              },
          ]
          for item in additions:
              key = (item["path"], item["lineText"], item["pattern"], item["occurrences"])
              if key not in declared:
                  inventory["findings"].append(item)
                  declared.add(key)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          docs_path = Path("docs/spaces-compatibility-inventory.md")
          docs = docs_path.read_text(encoding="utf-8")
          marker = "## Gate 0 compatibility vocabulary"
          if marker not in docs:
              docs += f"""

          {marker}

          Gate 0 records `{legacy}` as a closed compatibility input with the
          `absent` disposition established by this inventory. The token appears in the
          shared enum, canonical manifest, validation pairing, and fixture only so an
          old target can fail explicitly. It remains non-discoverable, grants no
          authority, creates no alias, and is not a second current application.

          These schema occurrences are reviewed as non-identity contract vocabulary;
          the only current application/package identity remains `greenways/spaces`.
          """
          docs_path.write_text(docs, encoding="utf-8")
          PY
      - name: Apply pinned formatting
        run: |
          rustfmt +1.85.1 --edition 2021 \
            crates/greenways-workspace-contracts/src/suite.rs \
            crates/greenways-workspace-contracts/tests/suite_gate0.rs
      - name: Verify closed inventory and whitespace
        run: |
          python3 scripts/check-spaces-compatibility-inventory.py
          git diff --check
      - name: Publish materialized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/greenways-workspace-contracts/src/suite.rs \
            crates/greenways-workspace-contracts/tests/suite_gate0.rs \
            crates/greenways-workspace-contracts/tests/fixtures/suite/current-suite.json \
            protocol/compatibility/spaces-research-inventory-0-alpha.json \
            docs/spaces-compatibility-inventory.md
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Gate 0 contract formatting"
          git push origin HEAD:agent/suite-contract-foundation
