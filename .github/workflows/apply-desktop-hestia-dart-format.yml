name: Apply Desktop Hestia Dart Formatting

on:
  push:
    branches:
      - agent/desktop-hestia-status-90-dart-format
    paths:
      - .github/agent/desktop-hestia-status-90-dart-format

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Apply Desktop Hestia Dart formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-hestia-status-90-dart-format
          fetch-depth: 0
      - name: Apply and verify the pinned Flutter formatter output
        shell: bash
        run: |
          set -euo pipefail

          git apply .github/agent/desktop-hestia-status-90-dart-format.patch

          test "$(git hash-object apps/greenways_desktop/lib/model/connection_snapshot.dart)" = "0f736268734d75f2b05a3c089b10d566610fca13"
          test "$(git hash-object apps/greenways_desktop/lib/ui/views.dart)" = "0bb797305a3fb46123fc025481ffff21e9c758e4"
          test "$(git hash-object apps/greenways_desktop/test/connection_snapshot_test.dart)" = "297ad14ecd16ae652fce780bc5d7d7456d7f333c"

          rm -f \
            .github/agent/desktop-hestia-status-90-dart-format \
            .github/agent/desktop-hestia-status-90-dart-format.patch \
            .github/workflows/apply-desktop-hestia-dart-format.yml

          git diff --check
          git config user.name "greenways-os-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Format Desktop Hestia readiness"
          git push origin HEAD:agent/desktop-hestia-status-90-dart-format
