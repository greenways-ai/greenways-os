name: Greenways OS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - name: Enforce gw.* HAL namespaces
        run: |
          if grep -R -E --include='*.hal' -n \
            -e '\(ns[[:space:]]+greenways\.' \
            -e '\[[[:space:]]*greenways\.' \
            -e '\([[:space:]]*greenways\.' \
            -e '[[:space:]]greenways\.[A-Za-z0-9_.-]+/' \
            ..; then
            echo "Legacy greenways.* HAL namespace found" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            services/mcp-gateway/package-lock.json
            services/packages/package-lock.json
            services/devtools-node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package release-shaped extension
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run package:extension
          cd release
          sha256sum --check greenways-os-extension-v*.zip.sha256
      - name: Verify the installed release archive
        run: npm run test:release
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            extension/test-results/
            extension/playwright-report/
          if-no-files-found: ignore
      - name: Test Home Link service
        if: always()
        working-directory: services/home-node
        run: npm test
      - name: Test MCP gateway and Worker build
        if: always()
        working-directory: services/mcp-gateway
        run: npm ci && npm run check
      - name: Test identity service
        if: always()
        working-directory: services/identity
        run: npm test
      - name: Test package registry service
        if: always()
        working-directory: services/packages
        run: npm ci && npm test
      - name: Test DevTools native host
        if: always()
        working-directory: services/devtools-node
        run: npm ci && npm test
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: greenways-os-extension
          path: |
            extension/release/greenways-os-extension-v*.zip
            extension/release/greenways-os-extension-v*.zip.sha256
            extension/release/greenways-os-extension-v*.json
          if-no-files-found: error
