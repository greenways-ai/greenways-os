name: Cloudflare MCP request-store bootstrap

on:
  push:
    branches:
      - agent/mcp-cloudflare-request-store-33

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Run Cloudflare MCP request-store bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/mcp-gateway/package-lock.json

      - name: Finish repository integration
        run: node .github/agent/mcp-cloudflare-request-store/finish.mjs

      - name: Add pinned Wrangler development dependency
        working-directory: services/mcp-gateway
        run: npm install --save-dev --save-exact wrangler@4.114.0

      - name: Run gateway, SQLite, and Worker checks
        working-directory: services/mcp-gateway
        run: npm run check

      - name: Verify repository patch
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/agent/mcp-cloudflare-request-store
          rm -f .github/workflows/mcp-cloudflare-request-store-bootstrap.yml

      - name: Commit and push
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git commit -m "Add Cloudflare SQLite MCP request store"
          git push origin HEAD:${GITHUB_REF_NAME}
